<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour toi, de la part de Freyd</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
:root{
  --bg:#fbeff1; --bg2:#f4d3da; --ink:#4a1428; --soft:#8a4a60; --rose:#b8325a; --gold:#a8772f; --card:#fffafa; --line:#e9bfca;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#22091a;--bg2:#3a0f27;--ink:#fbe7ea;--soft:#d9a3b3;--rose:#ee7a9c;--gold:#d9b06a;--card:#2f1022;--line:#5a2640}
}
:root[data-theme="dark"]{--bg:#22091a;--bg2:#3a0f27;--ink:#fbe7ea;--soft:#d9a3b3;--rose:#ee7a9c;--gold:#d9b06a;--card:#2f1022;--line:#5a2640}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg) 70%);color:var(--ink);font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-size:21px;line-height:1.5;display:flex;align-items:center;justify-content:center;padding:24px 18px;overflow-x:hidden}
main{width:100%;max-width:520px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:40px 28px 34px;box-shadow:0 18px 50px rgba(120,20,60,.16)}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:26px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
.dots i.on{background:var(--rose);transform:scale(1.25)}
.dots i.done{background:var(--gold)}
h1{font-weight:600;font-style:italic;font-size:clamp(34px,9vw,46px);line-height:1.12;margin:0 0 14px;color:var(--rose)}
h2{font-weight:600;font-size:clamp(27px,7vw,34px);line-height:1.2;margin:0 0 28px}
p{margin:0 0 26px;color:var(--soft)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:600;cursor:pointer;border-radius:999px;padding:12px 30px;border:1.5px solid var(--rose);text-decoration:none;display:inline-block;transition:transform .15s,background .2s}
button:active,.btn:active{transform:scale(.97)}
.yes,.btn{background:var(--rose);color:#fff}
.no{background:transparent;color:var(--rose)}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.msg{min-height:1.5em;margin-top:22px;font-style:italic;color:var(--gold)}
.sum{text-align:left;margin:0 0 26px;padding:0;list-style:none;font-size:18px}
.sum li{padding:8px 0;border-bottom:1px solid var(--line)}
.sum b{color:var(--rose)}
.intro{text-align:center;padding-top:150px}
.env{position:relative;width:min(320px,82vw);height:210px;margin:0 auto 34px;perspective:900px}
.env .back{position:absolute;inset:0;background:var(--line);border-radius:10px;box-shadow:0 18px 40px rgba(120,20,60,.2)}
.env .letter{position:absolute;left:9%;right:9%;top:10px;height:170px;background:var(--card);border:1px solid var(--line);border-radius:6px;z-index:2;display:flex;align-items:center;justify-content:center;font-style:italic;font-weight:600;font-size:28px;color:var(--rose);transition:transform 1s .6s ease}
.env.open .letter{transform:translateY(-150px)}
.env .pocket{position:absolute;inset:0;z-index:3;border-radius:10px;background:linear-gradient(var(--bg2),var(--line));clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:56%;z-index:4;background:linear-gradient(var(--line),var(--bg2));clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env .seal{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:5;font-size:30px;transition:opacity .3s}
.env.open .seal{opacity:0}
textarea{width:100%;font:inherit;font-size:20px;min-height:110px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;margin-bottom:18px}
textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.6;cursor:default}
.hide{display:none}
.petal{position:fixed;top:-8vh;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.petal{animation-duration:1.5s!important}}
</style>
</head>
<body>
<main>
  <section class="intro" id="intro">
    <div class="env" id="env" aria-hidden="true">
      <div class="back"></div>
      <div class="letter">Pour toi</div>
      <div class="pocket"></div>
      <div class="flap"></div>
      <div class="seal">❤️</div>
    </div>
    <h1>Une lettre t’attend</h1>
    <p>Ouvre-la et réponds avec ton cœur.</p>
    <button class="yes" id="start">Commencer</button>
  </section>

  <section class="card hide" id="quiz" aria-live="polite">
    <div class="dots" id="dots"></div>
    <h2 id="q"></h2>
    <div class="row" id="yn">
      <button class="yes" id="bYes">Oui</button>
      <button class="no" id="bNo">Non</button>
    </div>
    <div class="hide" id="txt">
      <textarea id="ta" rows="4" placeholder="Écris ce que tu ressens…" aria-label="Ta réponse"></textarea>
      <button class="yes" id="bNext">Envoyer ma réponse</button>
    </div>
    <div class="msg" id="msg"></div>
  </section>

  <section class="card hide" id="end">
    <h1>Merci, mon cœur</h1>
    <p>Voici tes réponses. Appuie sur le bouton pour me les envoyer.</p>
    <ul class="sum" id="sum"></ul>
    <div class="row">
      <a class="btn" id="mail" href="#">Envoyer mes réponses à Freyd</a>
      <button class="no" id="copy">Copier mes réponses</button>
    </div>
    <div class="msg" id="msg2"></div>
  </section>
</main>

<script>
(function(){
  var EMAIL = "tonerfreyd@gmail.com";
  var Q = [
    "Est-ce que tu aimes Freyd ?",
    "Qu’est-ce que tu penses de moi ?",
    "Serais-tu d’accord que je te prenne dans mes bras ?",
    "Es-tu heureuse quand on est ensemble ?",
    "Veux-tu qu’on se prépare un dîner aux chandelles, rien que nous deux ?",
    "Est-ce que tu me laisses te dire « je t’aime » tous les jours ?"
  ];
  var YES_MSG = ["Mon cœur s’emballe…","Merci, chaque mot me touche.","Tes bras, mon plus bel endroit.","Toi aussi, tu me rends heureux.","Je réserve la plus belle table.","Je ne m’en lasserai jamais."];
  var NO_MSG = "Merci d’être sincère, c’est important pour moi.";
  var answers = [], i = 0, locked = false, TEXTQ = 1;
  var $ = function(id){return document.getElementById(id)};

  function show(id){["intro","quiz","end"].forEach(function(s){$(s).classList.toggle("hide", s!==id)})}
  function dots(){
    $("dots").innerHTML = Q.map(function(_,k){
      return '<i class="'+(k<i?"done":k===i?"on":"")+'"></i>';
    }).join("");
  }
  function ask(){
    $("q").textContent = Q[i]; $("msg").textContent = ""; dots(); locked = false;
    var isT = (i===TEXTQ); $("yn").classList.toggle("hide", isT); $("txt").classList.toggle("hide", !isT); if(isT){ $("ta").value = ""; }
  }
  function flowers(){
    var set = ["🌸","🌹","🌷","💐","🌺","🌼"];
    for(var n=0;n<46;n++){
      var s = document.createElement("span");
      s.className = "petal";
      s.textContent = set[Math.floor(Math.random()*set.length)];
      s.style.left = (Math.random()*100)+"vw";
      s.style.fontSize = (20+Math.random()*26)+"px";
      s.style.animationDuration = (2.6+Math.random()*2.4)+"s";
      s.style.animationDelay = (Math.random()*0.9)+"s";
      document.body.appendChild(s);
      (function(el){setTimeout(function(){el.remove()},6500)})(s);
    }
  }
  function answer(yes){
    if(locked) return; locked = true;
    answers.push(yes);
    if(yes===false){ $("msg").textContent = NO_MSG; } else { flowers(); $("msg").textContent = YES_MSG[i]; }
    setTimeout(function(){ i++; if(i<Q.length){ ask(); } else { finish(); } }, yes===false?1600:2200);
  }
  function text(){
    var lines = ["Réponses de ma chérie :",""];
    Q.forEach(function(q,k){ lines.push(q+" → "+(typeof answers[k]==="string"?answers[k]:(answers[k]?"OUI":"NON"))); });
    return lines.join("\n");
  }
  function finish(){
    $("sum").innerHTML = "";
    Q.forEach(function(q,k){
      var li = document.createElement("li"), b = document.createElement("b"), a = answers[k];
      b.textContent = typeof a==="string" ? a : (a?"Oui":"Non");
      li.appendChild(document.createTextNode(q+" ")); li.appendChild(b); $("sum").appendChild(li);
    });
    $("mail").href = "mailto:"+EMAIL+"?subject="+encodeURIComponent("Mes réponses pour toi")+"&body="+encodeURIComponent(text());
    show("end");
    if(answers.every(Boolean)) flowers();
  }

  $("start").onclick = function(){
    $("start").disabled = true; $("env").classList.add("open");
    setTimeout(function(){ show("quiz"); ask(); }, 2400);
  };
  $("bYes").onclick = function(){ answer(true) };
  $("bNo").onclick = function(){ answer(false) };
  $("bNext").onclick = function(){
    var v = $("ta").value.trim();
    if(!v){ $("msg").textContent = "Écris quelques mots pour moi."; return; }
    answer(v);
  };
  $("copy").onclick = function(){
    var t = text();
    try{
      navigator.clipboard.writeText(t).then(function(){ $("msg2").textContent = "Copié. Tu peux me le coller en message."; },
        function(){ $("msg2").textContent = "Copie impossible, utilise le bouton d’envoi."; });
    }catch(e){ $("msg2").textContent = "Copie impossible, utilise le bouton d’envoi."; }
  };
})();
</script>
</body>
</html>
